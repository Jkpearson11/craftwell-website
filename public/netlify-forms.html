<!DOCTYPE html>
<html>
  <body>
    <!--
      This file exists solely so Netlify's post-processing bot can detect
      the "contact" form. The actual form is rendered by Contact.tsx and
      submitted via fetch(). Do not delete this file.
    -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="hidden" name="bot-field" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="projectType">
        <option>Kitchen Renovation</option>
        <option>Bathroom Remodel</option>
        <option>Full-Scale Remodel</option>
        <option>Water Damage Restoration</option>
        <option>Home Addition</option>
        <option>Repairs &amp; Maintenance</option>
        <option>Other</option>
      </select>
      <input name="budget" type="text" />
      <textarea name="message"></textarea>
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
